services:
  agile-front:
    image: solutis-agile-frontend:${FRONTEND_TAG:-latest}
    container_name: solutis-agile-frontend-prod
    build:
      context: ./solutis-agile-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: always
    env_file:
      - ./solutis-agile-frontend/.env
    networks:
      - agile-network

  taskview-front:
    image: solutis-taskview:${TASKVIEW_TAG:-latest}
    container_name: solutis-taskview-prod
    build:
      context: ./solutis-flow
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    restart: always
    env_file:
      - ./solutis-flow/.env
    networks:
      - agile-network

  solutis-sync:
    image: solutis-sync:${SYNC_TAG:-latest}
    container_name: solutis-sync-prod
    build:
      context: ./solutis-sync
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    volumes:
      - ./solutis-sync/logs:/solutis-sync/logs
      - ./solutis-sync/.env:/solutis-sync/.env
    command: uvicorn src.main:app --host 0.0.0.0 --port 8003 --workers 2
    restart: always
    env_file:
      - ./solutis-sync/.env
    networks:
      - agile-network

  agile-back:
    image: solutis-manager-back:${MANAGER_TAG:-latest}
    container_name: solutis-manager-back-prod
    build:
      context: ./solutis_manager_back
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - /mnt/storage:/storage
      - ./solutis_manager_back/logs:/solutis-agile/logs
      - ./solutis_manager_back/.env:/solutis-agile/.env
    command: sh -c "uv run alembic upgrade head && uv run uvicorn src.main:appAPI --host 0.0.0.0 --port 8080"
    restart: always
    environment:
      FLOW_SERVICE_HOST: ${FLOW_SERVICE_HOST:-http://solutis-flow-back:8004/api}
      REPORT_SERVICE_HOST: ${REPORT_SERVICE_HOST:-http://solutis-report:8002/api}
      PROCUREMENT_SERVICE_HOST: ${PROCUREMENT_SERVICE_HOST:-http://solutis-procurement:8001/api}
    env_file:
      - ./solutis_manager_back/.env
    networks:
      - agile-network

  solutis-procurement:
    image: solutis-procurement:${PROCUREMENT_TAG:-latest}
    container_name: solutis-procurement-prod
    build:
      context: ./solutis_procurement
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - /mnt/storage:/storage
      - ./solutis_procurement/logs:/app/logs
      - ./solutis_procurement/.env:/app/.env
      - ./solutis_procurement/db.sqlite3:/app/db.sqlite3
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8001 --workers 3"
    restart: always
    env_file:
      - ./solutis_procurement/.env
    networks:
      - agile-network

  solutis-report:
    image: solutis-report:${REPORT_TAG:-latest}
    container_name: solutis-report-prod
    build:
      context: ./solutis_report
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./solutis_report/logs:/solutis-report/logs
      - ./solutis_report/.env:/solutis-report/.env
    command: uvicorn src.main:app --host 0.0.0.0 --port 8002 --workers 2
    restart: always
    env_file:
      - ./solutis_report/.env
    networks:
      - agile-network

  flow-redis:
    image: redis:7-alpine
    container_name: solutis-flow-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - flow-redis-data:/data
    networks:
      - agile-network

  flow-db:
    image: postgres:16-alpine
    container_name: solutis-flow-db-prod
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${FLOW_DB_NAME:-flow_db}
      POSTGRES_USER: ${FLOW_DB_USER:-flow_user}
      POSTGRES_PASSWORD: ${FLOW_DB_PASSWORD:-flow_secret}
    volumes:
      - flow-postgres-data:/var/lib/postgresql/data
    networks:
      - agile-network

  solutis-flow-back:
    image: solutis-flow-back:${FLOW_BACK_TAG:-latest}
    container_name: solutis-flow-back-prod
    build:
      context: ./solutis_flow_back
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    volumes:
      - ./solutis_flow_back/logs:/solutis-flow-back/logs
      - ./solutis_flow_back/.env:/solutis-flow-back/.env
    depends_on:
      - flow-db
      - flow-redis
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8004 --workers 2
    restart: always
    env_file:
      - ./solutis_flow_back/.env
    networks:
      - agile-network

  solutis-flow-worker:
    image: solutis-flow-back:${FLOW_BACK_TAG:-latest}
    container_name: solutis-flow-worker-prod
    depends_on:
      - flow-db
      - flow-redis
    volumes:
      - ./solutis_flow_back/logs:/solutis-flow-back/logs
      - ./solutis_flow_back/.env:/solutis-flow-back/.env
    command: uv run dramatiq src.worker
    restart: always
    env_file:
      - ./solutis_flow_back/.env
    networks:
      - agile-network

volumes:
  flow-postgres-data:
  flow-redis-data:

networks:
  agile-network:
    driver: bridge
