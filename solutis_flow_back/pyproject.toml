[project]
name = "solutis-flow-back"
version = "0.1.0"
description = "Backend de governança operacional e orquestração de processos (Solutis Flow)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "alembic>=1.14.0",
    "loguru>=0.7.2",
    "dramatiq[redis]>=1.17.0",
    "redis>=5.2.0",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.pyrefly]
search-path = ["."]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["."]
