version: "3.8"

services:
  solutis-report:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./src:/solutis-report/src
      - ./logs:/solutis-report/logs
      - ./.env:/solutis-report/.env
    command: uvicorn src.main:app --host 0.0.0.0 --port 8002 --workers 2
    restart: always
    env_file:
      - ./.env
    networks:
      - agile-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/docs')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  agile-network:
    external: true
