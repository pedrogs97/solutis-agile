[project]
name = "solutis-report"
version = "1.2.3"
description = "Microsserviço de geração de relatórios"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.47.0",
    "aiomysql>=0.2.0",
    "pydantic-settings>=2.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.26.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
    "pylint>=3.0.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
source=["src"]
