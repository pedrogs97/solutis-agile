pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{js,jsx,ts,tsx,json,css,scss,md,yml,yaml,html}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint_staged:
      glob: '*.{js,jsx,ts,tsx}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    typecheck:
      run: npm run typecheck
